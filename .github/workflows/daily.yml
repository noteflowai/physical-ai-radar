name: daily radar

# The fallback publisher. The daily publish runs on a maintainer's machine via
# scripts/publish_daily.sh at 07:40 Asia/Singapore. This workflow wakes at 09:20 Singapore (01:20 UTC) and does
# nothing when main already carries the day, which is every day the machine is up.
#
# When the machine missed the day -- asleep, offline, a cron job stuck behind a lock
# -- nothing used to notice: the site simply showed yesterday. Now this run publishes
# the day itself and opens an issue saying so, and if publishing fails here too the
# scheduled run goes red, which GitHub mails to the maintainer. The token it uses is
# the per-run GITHUB_TOKEN, scoped to this repository and gone when the job ends.
on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max items on the daily shortlist"
        required: false
        default: "8"
      force:
        description: "Publish even when main already carries today's radar"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Was today published?
        id: fresh
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          DAY=$(python scripts/job_schedule.py)
          PUBLISHED=$(python -c "import json;print(json.load(open('radar/latest.json',encoding='utf-8')).get('date',''))")
          echo "day=${DAY}" >> "$GITHUB_OUTPUT"
          echo "RADAR_RUN_DAY=${DAY}" >> "$GITHUB_ENV"
          if [ "$PUBLISHED" = "$DAY" ] && [ "$FORCE" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main already carries the ${DAY} radar; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "main carries ${PUBLISHED:-no radar}; publishing ${DAY} here." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Self-check (no dependencies required)
        if: steps.fresh.outputs.run == 'true'
        run: python -m unittest discover -s tests

      - name: Generate today's radar
        if: steps.fresh.outputs.run == 'true'
        run: python -m pairadar --limit "${{ github.event.inputs.limit || '8' }}" --date "$RADAR_RUN_DAY"

      - name: Verify trilingual output and report fetch health
        if: steps.fresh.outputs.run == 'true'
        run: |
          DAY="$RADAR_RUN_DAY"
          for LANG in zh en ja; do
            test -s "radar/daily/${DAY}.${LANG}.md" || { echo "missing radar/daily/${DAY}.${LANG}.md"; exit 1; }
          done
          test -s assets/lane-distribution.svg
          test -s radar/latest.json
          # A total outage already failed the previous step. This surfaces the
          # partial case, which stays green on purpose.
          python - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          import json, pathlib
          fetch = json.loads(pathlib.Path("radar/latest.json").read_text(encoding="utf-8")).get("fetch", {})
          print("### Fetch health\n")
          print(f"- items collected: {fetch.get('items', 0)}")
          print(f"- sources answered: {fetch.get('answered', 0)}/{fetch.get('attempted', 0)}")
          per_source = fetch.get("per_source", {})
          if per_source:
              print("- per source: " + ", ".join(f"`{name}` {count}" for name, count in sorted(per_source.items())))
          if fetch.get("failed"):
              print("- **no answer from:** " + ", ".join(fetch["failed"]))
          PY
          # Repeated failures across days, from the run log. Never fatal: losing one
          # source must not turn the build red, so this only reports.
          python -m pairadar.health | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Commit when something changed
        id: publish
        if: steps.fresh.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --porcelain, not `git diff`: a day whose only change is a new file would
          # otherwise read as "nothing happened".
          if [ -z "$(git status --porcelain)" ]; then
            echo "no changes today"
            exit 0
          fi
          DAY="$RADAR_RUN_DAY"
          git add -A
          git commit -m "radar: ${DAY} update [skip ci]"
          # A run that started before somebody merged to main cannot fast-forward. That
          # happened on 2026-09-19: the run began at 13:42:20, a pull request merged at
          # 13:42:35, and the push was rejected with "fetch first" at 13:42:57 -- the day
          # was simply lost. The output is deterministic, so catch up rather than merge:
          # rebase the commit onto the new main, and if that cannot be resolved, throw the
          # commit away and regenerate on top of main instead of resolving a conflict in
          # generated files. `if` rather than `&&` chains, because a failing left-hand
          # side of `&&` under bash -e is a trap.
          # Every catch-up is followed by a push; a `for` loop ended on its last one.
          attempt=1
          until git push; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::could not push the ${DAY} radar after ${attempt} attempts"
              exit 1
            fi
            echo "push rejected on attempt ${attempt}; catching up with origin/main"
            attempt=$((attempt + 1))
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            echo "rebase failed; regenerating on top of the new main"
            git rebase --abort || true
            git reset --hard origin/main
            PUBLISHED=$(python -c "import json;print(json.load(open('radar/latest.json',encoding='utf-8')).get('date',''))")
            if [ "$PUBLISHED" = "$DAY" ] && [ "${{ github.event.inputs.force || 'false' }}" != "true" ]; then
              echo "${DAY} was published meanwhile by another run; keeping that one"
              exit 0
            fi
            python -m pairadar --limit "${{ github.event.inputs.limit || '8' }}" --date "$RADAR_RUN_DAY"
            if [ -z "$(git status --porcelain)" ]; then
              echo "the new main already carries an equivalent update"
              exit 0
            fi
            git add -A
            git commit -m "radar: ${DAY} update [skip ci]"
          done
          echo "pushed on attempt ${attempt}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        # Pages builds on push, but not reliably for a push made with GITHUB_TOKEN;
        # ask for the build instead of depending on that. Never fatal: the commit is in.
        if: steps.publish.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "::warning::could not request a Pages build"

      - name: Tell the maintainer the machine missed a day
        if: steps.publish.outputs.pushed == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ steps.fresh.outputs.day }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="The local publisher missed a day"
          BODY="The ${DAY} radar was not on main at 09:20 Asia/Singapore (01:20 UTC), so [this run](${RUN}) published it. Check \`~/.local/state/pairadar/publish.log\` on the publishing machine, then close this issue."
          # One open issue collects the misses, so a machine down for a week is one thread.
          OPEN=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number -q '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
