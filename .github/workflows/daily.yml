name: daily radar

on:
  schedule:
    # 01:30 UTC = 09:30 Asia/Shanghai = 10:30 Asia/Tokyo — after the arXiv daily announcement.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max items on the daily shortlist"
        required: false
        default: "8"

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Self-check (no dependencies required)
        run: python -m unittest discover -s tests

      - name: Generate today's radar
        run: python -m pairadar --limit "${{ github.event.inputs.limit || '8' }}"

      - name: Verify trilingual output and report fetch health
        run: |
          DAY=$(python -c "import datetime;print(datetime.datetime.now(datetime.timezone.utc).date())")
          for LANG in zh en ja; do
            test -s "radar/daily/${DAY}.${LANG}.md" || { echo "missing radar/daily/${DAY}.${LANG}.md"; exit 1; }
          done
          test -s assets/lane-distribution.svg
          test -s radar/latest.json
          # A total outage already failed the previous step. This surfaces the
          # partial case, which stays green on purpose.
          python - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          import json, pathlib
          fetch = json.loads(pathlib.Path("radar/latest.json").read_text(encoding="utf-8")).get("fetch", {})
          print("### Fetch health\n")
          print(f"- items collected: {fetch.get('items', 0)}")
          print(f"- sources answered: {fetch.get('answered', 0)}/{fetch.get('attempted', 0)}")
          per_source = fetch.get("per_source", {})
          if per_source:
              print("- per source: " + ", ".join(f"`{name}` {count}" for name, count in sorted(per_source.items())))
          if fetch.get("failed"):
              print("- **no answer from:** " + ", ".join(fetch["failed"]))
          PY
          # Repeated failures across days, from the run log. Never fatal: losing one
          # source must not turn the build red, so this only reports.
          python -m pairadar.health | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Commit when something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --porcelain, not `git diff`: a day whose only change is a new file would
          # otherwise read as "nothing happened".
          if [ -z "$(git status --porcelain)" ]; then
            echo "no changes today"
            exit 0
          fi
          DAY=$(python -c "import datetime;print(datetime.datetime.now(datetime.timezone.utc).date())")
          git add -A
          git commit -m "radar: ${DAY} update [skip ci]"
          # A run that started before somebody merged to main cannot fast-forward. That
          # happened on 2026-09-19: the run began at 13:42:20, a pull request merged at
          # 13:42:35, and the push was rejected with "fetch first" at 13:42:57 -- the day
          # was simply lost. The output is deterministic, so catch up rather than merge:
          # rebase the commit onto the new main, and if that cannot be resolved, throw the
          # commit away and regenerate on top of main instead of resolving a conflict in
          # generated files. `if` rather than `&&` chains, because a failing left-hand
          # side of `&&` under bash -e is a trap.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected on attempt ${attempt}; catching up with origin/main"
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            echo "rebase failed; regenerating on top of the new main"
            git rebase --abort || true
            git reset --hard origin/main
            python -m pairadar --limit "${{ github.event.inputs.limit || '8' }}"
            if [ -z "$(git status --porcelain)" ]; then
              echo "the new main already carries an equivalent update"
              exit 0
            fi
            git add -A
            git commit -m "radar: ${DAY} update [skip ci]"
          done
          echo "::error::could not push the ${DAY} radar after 3 attempts"
          exit 1
