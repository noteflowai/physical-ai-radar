name: source curator

# Manual only, and deliberately narrow: when pairadar.health says a source has
# stopped answering, let an agent look up the publisher's current endpoint and
# propose a fix in data/sources.json. The agent has no shell and cannot write
# outside data/; this workflow runs the tests, checks the diff and opens the pull
# request. Nothing here touches main.
on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Missed days before a source counts as struggling"
        required: false
        default: "3"
      force:
        description: "Run even when no source is struggling (for testing)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-curator
  cancel-in-progress: false

jobs:
  curate:
    runs-on: [self-hosted, tokyo]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Health verdict
        id: health
        run: |
          python3 -m pairadar.health --threshold "${{ inputs.threshold }}" | tee /tmp/health.json
          if python3 -m pairadar.health --threshold "${{ inputs.threshold }}" --fail-on-struggling >/dev/null; then
            echo "act=false" >> "$GITHUB_OUTPUT"
            echo "No source is over the threshold." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "act=true" >> "$GITHUB_OUTPUT"
            python3 -c "import json;print('Struggling:', ', '.join(f\"{s['source']} ({s['failed_days']}d)\" for s in json.load(open('/tmp/health.json'))['struggling']))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tooling and credentials
        if: steps.health.outputs.act == 'true' || inputs.force
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          command -v kiro-cli >/dev/null || { echo "kiro-cli is not installed on this runner"; exit 1; }
          kiro-cli --version
          test -n "$KIRO_API_KEY" || { echo "KIRO_API_KEY secret is not set; nothing was charged"; exit 1; }

      - name: Propose a repair
        id: curate
        if: steps.health.outputs.act == 'true' || inputs.force
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          # Granular trust only. --trust-all-tools bypasses the agent's own
          # allowedPaths/deniedPaths, which is the only enforced boundary here.
          kiro-cli chat --no-interactive --agent radar-curator --effort medium \
            --trust-tools=read,grep,glob,web_fetch,write \
            "Read the health verdict injected at startup. For the worst struggling source, check whether its endpoint still returns a feed. If it moved, fix only that entry in data/sources.json. If it is merely down, change nothing. Then write your report." \
            2>&1 | tee /tmp/curator.log
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/curator.log > /tmp/curator.txt

      - name: Only data/sources.json may change
        id: diff
        if: steps.health.outputs.act == 'true' || inputs.force
        run: |
          changed=$(git diff --name-only | tr '\n' ' ' | sed 's/ *$//')
          echo "changed: '${changed}'"
          if [ -z "$changed" ]; then
            echo "changed=none" >> "$GITHUB_OUTPUT"
            echo "The agent proposed no change." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$changed" = "data/sources.json" ]; then
            echo "changed=sources" >> "$GITHUB_OUTPUT"
            git diff -- data/sources.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=unexpected" >> "$GITHUB_OUTPUT"
            echo "Unexpected files touched: ${changed}" >> "$GITHUB_STEP_SUMMARY"
            git checkout -- .
            exit 1
          fi

      - name: Deterministic gate
        if: steps.diff.outputs.changed == 'sources'
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m pairadar --offline --no-readme --out /tmp/curator-preview

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'sources'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="curator/source-repair-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/sources.json
          git commit -m "sources: repair an endpoint that stopped answering"
          git push origin "$BRANCH"
          python3 - "$BRANCH" <<'PY'
          import json, os, subprocess, sys, urllib.request
          branch = sys.argv[1]
          body = ["The daily health check reported a source that stopped answering, and the "
                  "curator agent proposed this endpoint repair.\n",
                  "### Health verdict\n", "```json",
                  open("/tmp/health.json").read().strip(), "```\n",
                  "### Agent report\n", open("/tmp/curator.txt").read().strip(), "\n",
                  "The agent has no shell and cannot write outside `data/`. This workflow "
                  "checked that only `data/sources.json` changed and ran the full test suite "
                  "before opening this pull request. Confirm the endpoint yourself before merging."]
          payload = json.dumps({
              "title": "sources: repair an endpoint that stopped answering",
              "head": branch, "base": "main", "body": "\n".join(body),
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls",
              data=payload, method="POST", headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
          with urllib.request.urlopen(request, timeout=30) as response:
              print("opened", json.load(response)["html_url"])
          PY

      - name: Leave no artefacts behind
        if: always()
        run: |
          git checkout -- . || true
          git clean -fd radar assets || true
          rm -rf /tmp/curator-preview
