name: CI

on:
  push:
    branches: [main]
    paths:
      - "pairadar/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Offline render smoke test
        run: |
          python -m pairadar --offline --no-readme --date 2026-01-01
          test -s radar/daily/2026-01-01.zh.md
          test -s radar/daily/2026-01-01.en.md
          test -s radar/daily/2026-01-01.ja.md
          python - <<'PY'
          from pathlib import Path
          for lang, needle in (("zh", "前沿雷达"), ("en", "Physical AI Radar"), ("ja", "レーダー")):
              text = Path(f"radar/daily/2026-01-01.{lang}.md").read_text(encoding="utf-8")
              assert needle in text, f"{lang} page missing localized heading"
              assert "http" in text, f"{lang} page missing source links"
          print("offline render ok")
          PY

      - name: Validate JSON data files
        run: |
          python - <<'PY'
          import json, pathlib
          for path in sorted(pathlib.Path("data").glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print("ok", path)
          PY

  pages:
    # Builds the site the way GitHub Pages does, so a broken layout or a Liquid
    # error in a published page fails here rather than on main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Render the landing pages for the published day
        run: python -m pairadar --rerender --no-readme

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check the built site
        run: |
          python - <<'PY'
          import json, pathlib
          site = pathlib.Path("_site")
          day = json.loads(pathlib.Path("radar/latest.json").read_text(encoding="utf-8"))["date"]
          for page, lang in (("index.html", "zh-Hans"), ("en/index.html", "en"), ("ja/index.html", "ja"),
                             (f"radar/daily/{day}.zh.html", "zh-Hans"), (f"radar/daily/{day}.en.html", "en"),
                             (f"radar/daily/{day}.ja.html", "ja")):
              text = (site/page).read_text(encoding="utf-8")
              assert f'<html lang="{lang}">' in text, f"{page}: lang is not {lang}"
              assert "assets/site.css" in text, f"{page}: stylesheet missing"
              assert 'property="og:image"' in text, f"{page}: no social card"
          for asset in ("assets/site.css", "assets/favicon.svg", "assets/og.zh.png", "assets/og.en.png",
                        "assets/og.ja.png", "sitemap.xml", "robots.txt", "radar/feed.xml"):
              assert (site/asset).exists(), f"{asset} not published"
          assert f"radar/daily/{day}.en.html" in (site/"sitemap.xml").read_text(encoding="utf-8")
          print("pages ok")
          PY
