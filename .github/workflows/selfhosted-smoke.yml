name: self-hosted smoke

# Manual only. Verifies that the Tokyo L40S runner can check out the repo,
# see the GPU, and reproduce a full offline radar render.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, l40s]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Runner identity
        run: |
          echo "runner: ${RUNNER_NAME:-unknown} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "labels: self-hosted, l40s"
          hostname
          . /etc/os-release && echo "$PRETTY_NAME"

      - name: GPU visible
        run: nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader

      - name: Python and pipeline self-check
        run: |
          python3 -V
          python3 -m unittest discover -s tests

      - name: Offline render reproduces three languages
        run: |
          python3 -m pairadar --offline --no-readme --date 2026-01-01
          for LANG in zh en ja; do
            test -s "radar/daily/2026-01-01.${LANG}.md" || { echo "missing ${LANG}"; exit 1; }
          done
          wc -c radar/daily/2026-01-01.*.md

      - name: Leave no artefacts behind
        if: always()
        run: git checkout -- . && git clean -fd radar assets || true
